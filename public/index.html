<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приватный звонок</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
      width: 300px;
    }
    select, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }
    select {
      background: #2b2b2b;
      color: #fff;
    }
    button {
      background: #28a745;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background: #555;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Голосовой звонок</h2>
    
    <label for="role">Кто вы?</label>
    <select id="role">
      <option value="son">Я (Сын)</option>
      <option value="father">Отец</option>
    </select>

    <button id="callBtn">Позвонить</button>
    <div id="status">Выберите роль и нажмите Позвонить</div>
  </div>

  <audio id="remoteAudio" autoplay></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let localStream;
    let peerConnection;

    const callBtn = document.getElementById('callBtn');
    const roleSelect = document.getElementById('role');
    const statusDiv = document.getElementById('status');
    const remoteAudio = document.getElementById('remoteAudio');

    // Настройки STUN и TURN серверов для пробития мобильного интернета (NAT)
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelay',
          credential: 'openrelay'
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelay',
          credential: 'openrelay'
        }
      ]
    };

    callBtn.onclick = async () => {
      const role = roleSelect.value;
      socket.emit('join-room', role);
      statusDiv.innerText = "Подключение к сети...";
      callBtn.disabled = true;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        statusDiv.innerText = "Микрофон подключен. Ожидание ответа...";
      } catch (err) {
        statusDiv.innerText = "Ошибка: Доступ к микрофону отклонен!";
        callBtn.disabled = false;
        return;
      }
    };

    socket.on('user-connected', async () => {
      statusDiv.innerText = "Собеседник вошел. Начинаем звонок...";
      createPeerConnection();
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('offer', offer);
    });

    socket.on('offer', async (offer) => {
      statusDiv.innerText = "Входящий вызов...";
      createPeerConnection();
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit('answer', answer);
    });

    socket.on('answer', async (answer) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
      statusDiv.innerText = "Разговор идет...";
    });

    socket.on('ice-candidate', async (candidate) => {
      if (peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      }
    });

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', event.candidate);
        }
      };

      peerConnection.ontrack = (event) => {
        remoteAudio.srcObject = event.streams[0];
        statusDiv.innerText = "Соединение установлено! Говорите.";
      };
    }
  </script>
</body>
</html>
