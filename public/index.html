<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приватный Мессенджер</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Модалка регистрации */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      width: 90%; max-width: 340px;
      text-align: center;
    }
    .modal input, .modal select, .modal button {
      width: 100%; padding: 12px; margin-top: 10px;
      border-radius: 6px; border: none; font-size: 15px;
    }
    .modal input, .modal select { background: #2b2b2b; color: #fff; }
    .modal button { background: #4caf50; color: #fff; font-weight: bold; cursor: pointer; }

    /* Основной макет */
    #sidebar {
      width: 280px; background: #1e1e1e;
      border-right: 1px solid #2d2d2d;
      display: flex; flex-direction: column;
    }
    #sidebar-header { padding: 15px; background: #252525; font-weight: bold; border-bottom: 1px solid #333; }
    #user-list { flex: 1; overflow-y: auto; padding: 10px; }
    .user-card {
      background: #2b2b2b; padding: 10px; border-radius: 8px;
      margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    .user-card button {
      background: #28a745; color: #fff; border: none;
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }

    #main-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
    
    /* Зона видео */
    #video-container {
      flex: 1; display: flex; justify-content: center; align-items: center; position: relative;
    }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    #localVideo {
      position: absolute; bottom: 20px; right: 20px;
      width: 120px; height: 160px; object-fit: cover;
      border-radius: 8px; border: 2px solid #fff; background: #222;
    }

    #controls {
      height: 60px; background: #181818; display: flex;
      align-items: center; justify-content: center; gap: 15px;
    }
    .btn { padding: 10px 18px; border-radius: 20px; border: none; background: #333; color: #fff; cursor: pointer; }
    .btn.danger { background: #d9534f; }

    /* Окно входящего вызова */
    #incoming-modal {
      display: none; position: fixed; top: 20px; right: 20px;
      background: #2b2b2b; padding: 20px; border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8); z-index: 999; text-align: center;
    }
    #incoming-modal button { margin: 5px; padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; }
    .btn-accept { background: #4caf50; color: #fff; }
    .btn-decline { background: #e53935; color: #fff; }
  </style>
</head>
<body>

  <!-- Вход -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <h3>Вход в Мессенджер</h3>
      <input type="text" id="userNameInput" placeholder="Ваше имя" />
      <select id="roleSelect">
        <option value="Сын">Сын</option>
        <option value="Отец">Отец</option>
        <option value="Мама">Мама</option>
        <option value="Сестра">Сестра</option>
        <option value="Брат">Брат</option>
      </select>
      <button id="loginBtn">Войти</button>
    </div>
  </div>

  <!-- Окно входящего вызова -->
  <div id="incoming-modal">
    <div id="caller-name">Входящий звонок...</div>
    <div style="margin-top: 10px;">
      <button class="btn-accept" id="acceptBtn">Ответить</button>
      <button class="btn-decline" id="declineBtn">Отклонить</button>
    </div>
  </div>

  <!-- Список контактов -->
  <div id="sidebar">
    <div id="sidebar-header">Контакты онлайн</div>
    <div id="user-list"></div>
  </div>

  <!-- Зона разговора -->
  <div id="main-area">
    <div id="video-container">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div id="controls">
      <button class="btn" id="toggleAudio">🎤 Микрофон</button>
      <button class="btn" id="toggleVideo">📷 Камера</button>
      <button class="btn danger" id="endCallBtn">Завершить</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let localStream, peerConnection, currentCallTarget;

    const authModal = document.getElementById('authModal');
    const userNameInput = document.getElementById('userNameInput');
    const roleSelect = document.getElementById('roleSelect');
    const loginBtn = document.getElementById('loginBtn');
    const userList = document.getElementById('user-list');

    const incomingModal = document.getElementById('incoming-modal');
    const callerNameDiv = document.getElementById('caller-name');
    const acceptBtn = document.getElementById('acceptBtn');
    const declineBtn = document.getElementById('declineBtn');

    const remoteVideo = document.getElementById('remoteVideo');
    const localVideo = document.getElementById('localVideo');
    const endCallBtn = document.getElementById('endCallBtn');

    let incomingCallData = null;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' }
      ]
    };

    // Авторизация
    window.onload = () => {
      const name = localStorage.getItem('chat_name');
      if (name) userNameInput.value = name;
    };

    loginBtn.onclick = async () => {
      const userName = userNameInput.value.trim();
      const role = roleSelect.value;
      if (!userName) return alert('Введите имя');

      localStorage.setItem('chat_name', userName);
      authModal.style.display = 'none';

      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      localVideo.srcObject = localStream;

      socket.emit('register-user', { userName, role });
    };

    // Обновление списка контактов
    socket.on('update-user-list', (users) => {
      userList.innerHTML = '';
      users.forEach(u => {
        if (u.socketId !== socket.id) {
          const div = document.createElement('div');
          div.className = 'user-card';
          div.innerHTML = `
            <div><b>${u.userName}</b> (${u.role})</div>
            <button onclick="startCall('${u.socketId}')">📞 Звонок</button>
          `;
          userList.appendChild(div);
        }
      });
    });

    // Начать звонок
    async function startCall(targetSocketId) {
      currentCallTarget = targetSocketId;
      createPeerConnection(targetSocketId);

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      socket.emit('call-user', { userToCall: targetSocketId, offer });
    }

    // Входящий звонок
    socket.on('incoming-call', ({ from, caller, offer }) => {
      incomingCallData = { from, offer };
      callerNameDiv.innerText = `Звонит ${caller.userName} (${caller.role})`;
      incomingModal.style.display = 'block';
    });

    acceptBtn.onclick = async () => {
      incomingModal.style.display = 'none';
      const { from, offer } = incomingCallData;
      currentCallTarget = from;

      createPeerConnection(from);
      await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
      
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      socket.emit('accept-call', { to: from, answer });
    };

    declineBtn.onclick = () => {
      incomingModal.style.display = 'none';
      if (incomingCallData) {
        socket.emit('end-call', { to: incomingCallData.from });
      }
    };

    socket.on('call-accepted', async ({ answer }) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
    });

    socket.on('ice-candidate', async ({ candidate }) => {
      if (peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      }
    });

    socket.on('call-ended', () => {
      resetCall();
    });

    endCallBtn.onclick = () => {
      if (currentCallTarget) {
        socket.emit('end-call', { to: currentCallTarget });
      }
      resetCall();
    };

    function createPeerConnection(targetSocketId) {
      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.onicecandidate = (e) => {
        if (e.candidate) {
          socket.emit('ice-candidate', { target: targetSocketId, candidate: e.candidate });
        }
      };

      peerConnection.ontrack = (e) => {
        remoteVideo.srcObject = e.streams[0];
      };
    }

    function resetCall() {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      remoteVideo.srcObject = null;
      currentCallTarget = null;
    }
  </script>
</body>
</html>
